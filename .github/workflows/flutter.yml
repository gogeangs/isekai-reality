# 코드를 올릴 때마다 GitHub 서버에서 Flutter 분석과 테스트를 돌린다.
# 결과는 저장소의 Actions 탭에서 확인 (초록 체크 = 통과, 빨간 X = 실패)
# 전체 출력은 ci-results 브랜치의 test-output.txt 에도 남긴다.
# 화면 미리보기(screenshots/)와 밸런스 보고서(reports/)도 같은 브랜치에 올린다.
name: Flutter 테스트

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter 버전
        run: flutter --version

      - name: 패키지 설치
        run: flutter pub get

      - name: 플러그인 API 메모
        shell: bash
        run: |
          { for n in camera google_mlkit_face_detection google_mlkit_commons gal share_plus; do
              d=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name "${n}-*" | sort -V | tail -1); echo "== $d"
            done
            d=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name 'gal-*' | sort -V | tail -1); grep -rn "static Future" "$d/lib" | sed "s#$d/##"
            d=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name 'share_plus-*' | sort -V | tail -1); grep -rn "class ShareParams\|Future<ShareResult> share\|static.*instance" "$d/lib" | sed "s#$d/##"
            d=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name 'google_mlkit_commons-*' | sort -V | tail -1); grep -rn "factory InputImage\|class InputImageMetadata" -A8 "$d/lib" | sed "s#$d/##" | head -60
            d=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name 'google_mlkit_face_detection-*' | sort -V | tail -1); grep -n "FaceDetectorOptions({" -A12 "$d/lib/src/face_detector.dart"; grep -n "final .* boundingBox\|headEulerAngleZ\|trackingId" "$d/lib/src/face_detector.dart"; grep -rn "ios, '\|platform :ios\|s.platform\|ios.deployment_target" "$d/ios" 2>/dev/null
          } > api-notes.txt 2>&1 || true

      - name: 코드 분석
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze-output.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: 테스트
        run: flutter test --reporter expanded --timeout 4m 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: 결과를 ci-results 브랜치에 저장
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci
          cp analyze-output.txt test-output.txt api-notes.txt /tmp/ci/ 2>/dev/null || true
          cp -r build/screenshots /tmp/ci/screenshots 2>/dev/null || true
          cp -r build/reports /tmp/ci/reports 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI 결과 ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
