name: isekai_reality
description: "이세계가 현실이라면? : 여명의 탑 아르카 — 페이즈 1 (상태창 + 동네 탐험)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  health: ">=10.2.0 <11.0.0"
  shared_preferences: ^2.2.0
  flutter_naver_map: ^1.4.4
  geolocator: ">=12.0.0 <15.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/legal/
  # 제목·숫자용 글꼴 (고운바탕 Bold, OFL). 자주 쓰는 한글 2,350자만 남겨 크기를 줄였다.
  fonts:
    - family: Title
      fonts:
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700
