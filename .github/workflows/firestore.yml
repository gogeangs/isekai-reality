# 묶음 55 #245: Firestore 보안 규칙을 서비스 계정으로 배포한다 (firebase/firestore.rules 가 바뀔 때).
# 계정 삭제 요청 뒤 7일이 지나면 Firestore TTL 이 expireAt 칸을 보고 스스로 지우게 정책도 켠다.
# 필요한 저장소 비밀값: FIREBASE_SERVICE_ACCOUNT (서비스 계정 JSON 전체)
name: Firestore 규칙 배포

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - ".github/workflows/firestore.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - name: 서비스 계정 파일
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT 가 없어 건너뜁니다."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: 규칙 배포 (Firebase Rules API)
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          TOKEN=$(gcloud auth print-access-token)
          API=https://firebaserules.googleapis.com/v1/projects/arca-d0cab
          BODY=$(python3 -c 'import json;print(json.dumps({"source":{"files":[{"name":"firestore.rules","content":open("firebase/firestore.rules").read()}]}}))')
          RES=$(curl -sS -X POST "$API/rulesets" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY")
          NAME=$(printf '%s' "$RES" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("name",""))')
          if [ -z "$NAME" ]; then echo "규칙 올리기 실패:"; printf '%s\n' "$RES" | head -c 600; exit 1; fi
          echo "올린 규칙: $NAME"
          REL='{"release":{"name":"projects/arca-d0cab/releases/cloud.firestore","rulesetName":"'"$NAME"'"}}'
          OUT=$(curl -sS -X PATCH "$API/releases/cloud.firestore" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$REL")
          printf '%s' "$OUT" | grep -q rulesetName || { echo "적용 실패:"; printf '%s\n' "$OUT" | head -c 600; exit 1; }
          echo "Firestore 규칙 적용 완료"

      - name: 계정 삭제용 TTL 정책 (expireAt)
        continue-on-error: true
        run: |
          for g in users parts; do
            gcloud firestore fields ttls update expireAt --collection-group=$g \
              --enable-ttl --project=arca-d0cab --async --quiet || echo "::warning::TTL 정책($g)을 켜지 못했어요"
          done

      - name: 서비스 계정 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
