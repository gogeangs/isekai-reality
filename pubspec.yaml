name: isekai_reality
description: "이세계가 현실이라면? : 여명의 탑 아르카 — 페이즈 1 (상태창 + 동네 탐험)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  health: ">=11.0.0 <14.0.0"
  shared_preferences: ^2.2.0
  flutter_naver_map: ^1.4.4
  geolocator: ">=12.0.0 <15.0.0"
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  url_launcher: ^6.3.0
  # 11-11 #60 마법 돋보기: 카메라, 얼굴 인식(휴대폰 안에서), 사진 저장, 공유
  camera: ^0.11.0
  google_mlkit_face_detection: ">=0.12.0 <1.0.0"
  gal: ^2.3.0
  share_plus: ^11.0.0
  # #60 Snap Camera Kit 시험 렌즈 (엘프 1개, 묶음 13 A2)
  camerakit_flutter: ^1.0.7
  path_provider: ^2.1.0
  # 11-11 #75 전투 효과음 (Oculus Audio Pack 01, CC BY 4.0)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/rig/
    - assets/legal/
    - assets/data/
    - assets/sfx/
  # 제목·숫자용 글꼴 (고운바탕 Bold, OFL). 자주 쓰는 한글 2,350자만 남겨 크기를 줄였다.
  fonts:
    - family: Title
      fonts:
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700
