# 테스트용 Android 설치 파일(APK)을 GitHub 서버에서 만든다.
# 결과: 저장소 Releases 의 'android-test' 에 isekai-reality.apk 로 올라간다.
# 네이버 지도 Client ID 는 저장소 비밀값 NAVER_MAP_CLIENT_ID 에서 읽는다 (2026-11-09 등록, 없으면 지도 대신 탐험 현황).
name: Android 테스트 빌드

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "테스터에게 올리기 (끄면 빌드만 확인)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "tool/prepare_android.py"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: android 폴더 만들기
        run: flutter create --platforms android --org kr.itso --project-name isekai_reality .

      - name: 게임에 필요한 설정 넣기
        env:
          # #60 Snap Camera Kit: 출시용 승인 전까지는 시험용(Staging) 토큰
          SNAP_APP_ID: ${{ secrets.SNAP_APP_ID }}
          SNAP_API_TOKEN: ${{ secrets.SNAP_API_TOKEN_STAGING }}
          ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/prepare_android.py

      - name: APK 만들기
        env:
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          SNAP_APP_ID: ${{ secrets.SNAP_APP_ID }}
          SNAP_LENS_GROUP_ID: ${{ secrets.SNAP_LENS_GROUP_ID }}
          SNAP_ELF_LENS_ID: ${{ vars.SNAP_ELF_LENS_ID }}
          # 묶음 15 #103 AdMob (저장소 변수, 없으면 Google 시험 광고)
          ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS }}
          ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
          ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS }}
          ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID }}
        shell: bash
        run: |
          # 요즘 Android 휴대폰(64비트 ARM)용만 만들어 파일 크기를 줄인다
          flutter build apk --release --target-platform android-arm64 \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=APP_COMMIT=${{ github.sha }} \
            --dart-define=NAVER_MAP_CLIENT_ID="${NAVER_MAP_CLIENT_ID}" \
            --dart-define=SNAP_ON="${SNAP_APP_ID:+1}" \
            --dart-define=SNAP_LENS_GROUP_ID="${SNAP_LENS_GROUP_ID}" \
            --dart-define=SNAP_ELF_LENS_ID="${SNAP_ELF_LENS_ID}" \
            --dart-define=ADS_ON=1 \
            --dart-define=ADMOB_REWARDED_IOS="${ADMOB_REWARDED_IOS:-ca-app-pub-3940256099942544/1712485313}" \
            --dart-define=ADMOB_REWARDED_ANDROID="${ADMOB_REWARDED_ANDROID:-ca-app-pub-3940256099942544/5224354917}" \
            --dart-define=SNAP_STAGE=staging 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          [ $status -eq 0 ] && cp build/app/outputs/flutter-apk/app-release.apk isekai-reality.apk
          exit $status

      - name: Releases 에 올리기
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTE="테스트용 Android 설치 파일 (커밋 ${GITHUB_SHA::7}, $(date -u +%F))"
          if gh release view android-test >/dev/null 2>&1; then
            gh release upload android-test isekai-reality.apk --clobber
            gh release edit android-test --notes "$NOTE"
          else
            gh release create android-test isekai-reality.apk \
              --title "Android 테스트 빌드" --notes "$NOTE" --prerelease
          fi

      - name: 빌드 기록을 android-log 브랜치에 저장
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/log
          cp build-output.txt /tmp/log/ 2>/dev/null || echo "(빌드 전에 멈춤)" > /tmp/log/build-output.txt
          cp android/app/src/main/AndroidManifest.xml /tmp/log/ 2>/dev/null || true
          cp android/app/build.gradle* /tmp/log/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/log/commit.txt
          cd /tmp/log
          git init -q -b android-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Android 빌드 기록 ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-log
