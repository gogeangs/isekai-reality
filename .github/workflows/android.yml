# 테스트용 Android 설치 파일(APK)을 GitHub 서버에서 만든다.
# 결과: 저장소 Releases 의 'android-test' 에 isekai-reality.apk 로 올라간다.
# 네이버 지도 Client ID 는 저장소 비밀값 NAVER_MAP_CLIENT_ID 에서 읽는다 (없으면 지도 대신 탐험 현황).
name: Android 테스트 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "tool/prepare_android.py"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: android 폴더 만들기
        run: flutter create --platforms android --org kr.itso --project-name isekai_reality .

      - name: 게임에 필요한 설정 넣기
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/prepare_android.py

      - name: APK 만들기
        env:
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=NAVER_MAP_CLIENT_ID="${NAVER_MAP_CLIENT_ID}"
          cp build/app/outputs/flutter-apk/app-release.apk isekai-reality.apk

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTE="테스트용 Android 설치 파일 (커밋 ${GITHUB_SHA::7}, $(date -u +%F))"
          if gh release view android-test >/dev/null 2>&1; then
            gh release upload android-test isekai-reality.apk --clobber
            gh release edit android-test --notes "$NOTE"
          else
            gh release create android-test isekai-reality.apk \
              --title "Android 테스트 빌드" --notes "$NOTE" --prerelease
          fi
