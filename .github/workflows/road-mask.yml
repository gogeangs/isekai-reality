name: 길 격자 만들기

on:
  workflow_dispatch:
  push:
    branches: [main, 'wip/**']
    paths:
      - tool/build_road_mask.py
      - .github/workflows/road-mask.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap 에서 길 격자 만들기
        run: python3 tool/build_road_mask.py assets/data/road_mask.json
      - name: 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/data/road_mask.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "길 격자 갱신 (OpenStreetMap)"
          git push
