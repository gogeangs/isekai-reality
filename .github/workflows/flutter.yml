# 코드를 올릴 때마다 GitHub 서버에서 Flutter 분석과 테스트를 돌린다.
# 결과는 저장소의 Actions 탭에서 확인 (초록 체크 = 통과, 빨간 X = 실패)
# 전체 출력은 ci-results 브랜치의 test-output.txt 에도 남긴다.
# 화면 미리보기(screenshots/)와 밸런스 보고서(reports/)도 같은 브랜치에 올린다.
name: Flutter 테스트

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 11-17: 그림(assets/images/**)·README 만 바꾼 push 는 테스트·캡처를 건너뛴다.
  # main · 묶음 브랜치(wip/batch*) · pull request · 손으로 돌리기는 늘 전체 테스트.
  # (WebP 바꾸기는 그림을 main 에 합칠 때 개발이 tool/optimize_images.py 로 하므로 따로 돌리지 않는다)
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.check.outputs.full }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          full=true
          ref="${GITHUB_REF#refs/heads/}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$ref" != "main" ] && [[ "$ref" != wip/batch* ]] \
             && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -vE '^assets/images/|(^|/)README[^/]*$' || true)
            if [ -z "$other" ]; then full=false; fi
          fi
          echo "바뀐 곳이 그림·README 뿐이면 건너뜀 → full=$full"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  # 11-17: 빨리 알기 — 가장 새 묶음 시험(캡처 빼고)과 코드 분석을 먼저 돌려 틀리면 1~2분 안에 전체를 멈춘다
  quick:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 패키지 설치
        run: flutter pub get

      - name: 코드 분석
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze-output.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - name: 가장 새 묶음 시험
        shell: bash
        run: |
          f=$(ls test/batch*_test.dart | grep -v shots | sed -E 's/.*batch([0-9]+)_test.dart/\1 &/' | sort -n | tail -1 | cut -d' ' -f2)
          echo "먼저 돌리는 시험: $f"
          flutter test --reporter expanded --timeout 4m "$f"

      - name: 틀리면 전체 멈추기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze
          path: analyze-output.txt
          if-no-files-found: ignore

  # 11-17: 전체 시험을 넷으로 나눠 동시에 (8분 → 2~3분)
  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter 버전
        if: matrix.shard == 0
        run: flutter --version

      # 묶음 17 #145: 새로 올린 PNG·JPG 그림을 WebP 로 (이미 바꾼 그림은 건너뜀)
      - name: 그림 줄이기
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/optimize_images.py

      - name: 패키지 설치
        run: flutter pub get

      - name: 플러그인 API 메모
        if: matrix.shard == 0
        shell: bash
        run: |
          { for n in camera google_mlkit_face_detection google_mlkit_commons gal share_plus; do
              d=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name "${n}-*" | sort -V | tail -1); echo "== $d"
            done
          } > api-notes.txt 2>&1 || true

      - name: 테스트 (${{ matrix.shard }}/4)
        run: |
          flutter test --reporter expanded --timeout 4m --total-shards 4 --shard-index ${{ matrix.shard }} \
            2>&1 | tee test-output-${{ matrix.shard }}.txt; exit ${PIPESTATUS[0]}
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            test-output-${{ matrix.shard }}.txt
            api-notes.txt
            build/screenshots
            build/reports
          if-no-files-found: ignore

  # 넷으로 나눈 결과를 모아 ci-results 브랜치에 저장 (화면 미리보기 · 밸런스 보고서 포함)
  results:
    needs: [changes, quick, test]
    if: always() && github.event_name == 'push' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: 결과를 ci-results 브랜치에 저장
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci/screenshots /tmp/ci/reports
          cp art/analyze/analyze-output.txt /tmp/ci/ 2>/dev/null || true
          for d in art/shard-*; do
            [ -d "$d" ] || continue
            cat "$d"/test-output-*.txt >> /tmp/ci/test-output.txt 2>/dev/null || true
            cp "$d"/api-notes.txt /tmp/ci/ 2>/dev/null || true
            cp -r "$d"/build/screenshots/. /tmp/ci/screenshots/ 2>/dev/null || true
            cp -r "$d"/build/reports/. /tmp/ci/reports/ 2>/dev/null || true
          done
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          cd /tmp/ci
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI 결과 ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
