# iPhone 테스트 앱을 GitHub 서버의 Mac 에서 만들어 TestFlight 로 올린다.
# 필요한 저장소 비밀값 (Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID            Apple 개발자 팀 ID (10자리)
#   ASC_KEY_ID               App Store Connect API 키 ID
#   ASC_ISSUER_ID            App Store Connect API 발급자(Issuer) ID
#   ASC_KEY_P8               내려받은 AuthKey_XXXX.p8 파일 내용 전체
#   NAVER_MAP_CLIENT_ID      네이버 지도 Client ID (Android 와 같음)
# 비밀값이 없으면 빌드를 건너뛴다. (2026-11-09 비밀값 등록)
name: iPhone 테스트 빌드

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "테스터에게 올리기 (끄면 빌드만 확인)"
        type: boolean
        default: true
      real_ads:
        description: "실제 광고 단위 쓰기 (출시 빌드만 켜기. 끄면 Google 시험 광고)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "tool/prepare_ios.py"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
      # #60 Snap Camera Kit: 출시용(Production)이 승인되기 전까지는 시험용(Staging, 워터마크)
      SNAP_APP_ID: ${{ secrets.SNAP_APP_ID }}
      SNAP_API_TOKEN: ${{ secrets.SNAP_API_TOKEN_STAGING }}
      SNAP_LENS_GROUP_ID: ${{ secrets.SNAP_LENS_GROUP_ID }}
      SNAP_ELF_LENS_ID: ${{ vars.SNAP_ELF_LENS_ID || '3ff54981-128a-44ab-ba03-0a5897b18f1b' }}
      # 묶음 15 #103 AdMob (저장소 변수, 없으면 Google 시험 광고)
      ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS }}
      ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
      ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS }}
      ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID }}
    steps:
      - name: 비밀값 확인
        id: check
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Apple 비밀값이 아직 없어 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
        with:
          fetch-depth: 0

      # 그림은 wip/images 브랜치에 모아 두고, 개발 빌드가 돌 때 함께 main 에 합친다.
      # (GITHUB_TOKEN 으로 올린 커밋은 빌드를 다시 부르지 않는다)
      - name: 모아 둔 그림 합치기 (wip/images)
        if: steps.check.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch --no-tags origin wip/images 2>/dev/null; then
            echo "wip/images 브랜치가 없어 건너뜁니다."; exit 0
          fi
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "새로 모아 둔 그림이 없습니다."; exit 0
          fi
          if git merge --no-edit -m "모아 둔 그림 합치기 (wip/images)" FETCH_HEAD; then
            # 묶음 17 #145: 합친 PNG·JPG 를 WebP 로 바꿔 함께 올린다
            python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
            python3 tool/optimize_images.py
            git add -A assets/images
            git commit -q -m "합친 그림을 WebP 로 줄이기" || true
            git push origin HEAD:main || echo "main 이 그새 바뀌어 올리지 못했어요. 이번 빌드에는 그림이 들어갑니다."
          else
            git merge --abort || true
            echo "::warning::그림 합치기 충돌. 이번 빌드는 그림 없이 진행합니다."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: ios 폴더 만들기와 설정
        if: steps.check.outputs.ready == 'true'
        run: |
          flutter create --platforms ios --org kr.itso --project-name isekai_reality .
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 tool/optimize_images.py
          python3 tool/prepare_ios.py

      - name: API 키 파일
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: 앱 만들기 (서명 전)
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD=${{ github.run_number }} \
            --dart-define=APP_COMMIT=${{ github.sha }} \
            --dart-define=NAVER_MAP_CLIENT_ID="${NAVER_MAP_CLIENT_ID}" \
            --dart-define=SNAP_ON="${SNAP_APP_ID:+1}" \
            --dart-define=SNAP_LENS_GROUP_ID="${SNAP_LENS_GROUP_ID}" \
            --dart-define=SNAP_ELF_LENS_ID="${SNAP_ELF_LENS_ID}" \
            --dart-define=ADS_ON=1 \
            --dart-define=ADS_REAL=${{ inputs.real_ads == true && '1' || '0' }} \
            --dart-define=ADMOB_REWARDED_IOS="${ADMOB_REWARDED_IOS:-ca-app-pub-3940256099942544/1712485313}" \
            --dart-define=ADMOB_REWARDED_ANDROID="${ADMOB_REWARDED_ANDROID:-ca-app-pub-3940256099942544/5224354917}" \
            --dart-define=SNAP_STAGE=staging 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}

      - name: 서명하고 TestFlight 로 올리기
        if: steps.check.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload)
        shell: bash
        run: |
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # 개발용 서명(테스트 기기 필요)을 건너뛰고 서명 없이 묶은 뒤,
          # HealthKit 권한만 임시 서명으로 붙여 두고, 내보낼 때 App Store 배포 서명을 한다.
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee -a build-output.txt | grep -E "error:|ARCHIVE" || true
          test -d build/Runner.xcarchive
          APP=build/Runner.xcarchive/Products/Applications/Runner.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) \
              -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | tee -a build-output.txt
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            "${AUTH[@]}" 2>&1 | tee -a build-output.txt
          exit ${PIPESTATUS[0]}

      - name: 빌드 기록을 ios-log 브랜치에 저장
        if: always() && steps.check.outputs.ready == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/log
          tail -c 200000 build-output.txt > /tmp/log/build-output.txt 2>/dev/null || echo "(빌드 전에 멈춤)" > /tmp/log/build-output.txt
          echo "${GITHUB_SHA}" > /tmp/log/commit.txt
          cd /tmp/log
          git init -q -b ios-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "iPhone 빌드 기록 ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-log
