name: 전국 제외 구역 만들기

on:
  workflow_dispatch:
  push:
    branches: [main, 'wip/**']
    paths:
      - tool/build_exclusions.py
      - .github/workflows/exclusions.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: OpenStreetMap 에서 학교·병원·묘지 받기
        run: python3 tool/build_exclusions.py assets/data/exclusions.json
      - name: 저장소에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/data/exclusions.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "전국 제외 구역 갱신 (OpenStreetMap)"
          git pull --rebase
          git push
